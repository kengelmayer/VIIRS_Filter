# Hourly VIIRS processing. The workflow is triggered externally by Cloudflare Cron.
# Cloudflare R2 stores both the previous rolling state and the public GeoJSON.

name: Update filtered VIIRS hotspots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viirs-update
  cancel-in-progress: false

env:
  R2_BUCKET: viirs-data
  R2_OBJECT: viirs_vegetation.geojson
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore rolling dataset from R2
        run: |
          mkdir -p site
          output="site/viirs_vegetation.geojson"

          # Verify that R2 credentials and bucket access work before doing anything.
          aws --version
          aws s3 ls "s3://${R2_BUCKET}/" \
            --endpoint-url "${R2_ENDPOINT}" >/dev/null

          # Normally restore the previous rolling dataset directly from R2.
          if aws s3api head-object \
            --bucket "${R2_BUCKET}" \
            --key "${R2_OBJECT}" \
            --endpoint-url "${R2_ENDPOINT}" >/dev/null 2>&1; then

            aws s3 cp \
              "s3://${R2_BUCKET}/${R2_OBJECT}" \
              "${output}" \
              --endpoint-url "${R2_ENDPOINT}" \
              --no-progress

            echo "Restored previous rolling dataset from R2"

          else
            # First R2 run only: import the currently published GitHub Pages file.
            # If that is unavailable, start with an empty FeatureCollection.
            echo "No previous R2 object found; trying GitHub Pages migration"

            if curl --fail --location --silent --show-error \
              "https://kengelmayer.github.io/VIIRS_Filter/viirs_vegetation_24h.geojson?run=${GITHUB_RUN_ID}" \
              --output "${output}"; then

              echo "Imported previous dataset from GitHub Pages"
            else
              cp data/empty_feature_collection.geojson "${output}"
              echo "No previous Pages dataset available; starting empty"
            fi
          fi

          # Never continue with a corrupt rolling state.
          jq -e \
            '.type == "FeatureCollection" and (.features | type == "array")' \
            "${output}" >/dev/null

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::curl
            any::jsonlite
            any::terra

      - name: Test helper functions
        run: Rscript tests/test_helpers.R

      - name: Update rolling GeoJSON
        env:
          VIIRS_OUTPUT_PATH: site/viirs_vegetation.geojson

          # Seven-day rolling window.
          ROLLING_WINDOW_HOURS: "168"

          SOURCE_OVERLAP_HOURS: "1"
          BOOTSTRAP_HOURS: "0"
          LANDCOVER_GRID_SIZE: "3"
          VEGETATION_SHARE_THRESHOLD: "0.5"
          REJECT_BUILT_CENTER: "true"
          VEGETATION_CODES: "10,20,30,40,90,95,100"
          VIIRS_CONFIDENCE: "nominal,high"
        run: Rscript R/update_viirs.R

      - name: Validate output
        run: |
          jq -e \
            '.type == "FeatureCollection" and (.features | type == "array")' \
            site/viirs_vegetation.geojson >/dev/null

          bytes=$(stat --format='%s' site/viirs_vegetation.geojson)
          mebibytes=$(awk "BEGIN {printf \"%.2f\", ${bytes}/1024/1024}")

          echo "GeoJSON size: ${mebibytes} MiB"
          echo "Features: $(jq '.features | length' site/viirs_vegetation.geojson)"

      - name: Publish GeoJSON to Cloudflare R2
        run: |
          # Overwrite the same object atomically from the consumer's perspective.
          # Five-minute browser/CDN caching keeps public traffic away from R2
          # while remaining sufficiently fresh for an hourly dataset.
          aws s3 cp \
            site/viirs_vegetation.geojson \
            "s3://${R2_BUCKET}/${R2_OBJECT}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/geo+json" \
            --cache-control "public,max-age=300" \
            --no-progress

          # Publish the lightweight status information as well.
          aws s3 cp \
            site/status.json \
            "s3://${R2_BUCKET}/status.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/json" \
            --cache-control "public,max-age=300" \
            --no-progress

          echo "Published ${R2_OBJECT} to Cloudflare R2"
