# Production VIIRS workflow:
# R2 -> update/filter -> R2
# Triggered hourly through Cloudflare Worker -> workflow_dispatch

name: Update filtered VIIRS hotspots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viirs-update
  cancel-in-progress: false

env:
  R2_BUCKET: viirs-data
  R2_OBJECT: viirs_vegetation.geojson
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore rolling dataset from R2
        run: |
          mkdir -p site

          # The production workflow expects the rolling file to exist in R2.
          aws s3 cp \
            "s3://${R2_BUCKET}/${R2_OBJECT}" \
            site/viirs_vegetation.geojson \
            --endpoint-url "${R2_ENDPOINT}" \
            --no-progress

          # Fail immediately if the restored state is invalid.
          jq -e \
            '.type == "FeatureCollection" and (.features | type == "array")' \
            site/viirs_vegetation.geojson >/dev/null

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::curl
            any::jsonlite
            any::terra

      - name: Test helper functions
        run: Rscript tests/test_helpers.R

      - name: Update rolling GeoJSON
        env:
          VIIRS_OUTPUT_PATH: site/viirs_vegetation.geojson
          ROLLING_WINDOW_HOURS: "168"
          SOURCE_OVERLAP_HOURS: "1"
          BOOTSTRAP_HOURS: "0"
          LANDCOVER_GRID_SIZE: "3"
          VEGETATION_SHARE_THRESHOLD: "0.5"
          REJECT_BUILT_CENTER: "true"
          VEGETATION_CODES: "10,20,30,40,90,95,100"
          VIIRS_CONFIDENCE: "nominal,high"
        run: Rscript R/update_viirs.R

      - name: Validate output
        run: |
          jq -e \
            '.type == "FeatureCollection" and (.features | type == "array")' \
            site/viirs_vegetation.geojson >/dev/null

          bytes=$(stat --format='%s' site/viirs_vegetation.geojson)
          mebibytes=$(awk "BEGIN {printf \"%.2f\", ${bytes}/1024/1024}")

          echo "GeoJSON size: ${mebibytes} MiB"
          echo "Features: $(jq '.features | length' site/viirs_vegetation.geojson)"

      - name: Publish to Cloudflare R2
        run: |
          # Replace the current public rolling dataset.
          aws s3 cp \
            site/viirs_vegetation.geojson \
            "s3://${R2_BUCKET}/${R2_OBJECT}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/geo+json" \
            --cache-control "public,max-age=300" \
            --no-progress

          # Publish status information generated by update_viirs.R.
          aws s3 cp \
            site/status.json \
            "s3://${R2_BUCKET}/status.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/json" \
            --cache-control "public,max-age=300" \
            --no-progress
