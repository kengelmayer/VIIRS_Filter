name: Update and publish filtered VIIRS hotspots

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore the previously published rolling file
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p site
          state_url="${PAGES_BASE_URL%/}/viirs_vegetation_24h.geojson?run=${GITHUB_RUN_ID}"
          temporary_file="${RUNNER_TEMP}/previous-viirs.geojson"

          if ! http_status=$(curl --location --silent --show-error \
            --output "${temporary_file}" \
            --write-out '%{http_code}' \
            "${state_url}"); then
            echo "Could not contact the existing Pages site"
            exit 1
          fi

          case "${http_status}" in
            200)
              jq -e '.type == "FeatureCollection" and (.features | type == "array")' \
                "${temporary_file}" >/dev/null
              mv "${temporary_file}" site/viirs_vegetation_24h.geojson
              echo "Restored the previously published rolling file"
              ;;
            404)
              cp data/empty_feature_collection.geojson site/viirs_vegetation_24h.geojson
              echo "No previous deployment found; starting with an empty state"
              ;;
            *)
              echo "Pages returned unexpected HTTP status ${http_status}"
              exit 1
              ;;
          esac

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::curl
            any::jsonlite
            any::terra

      - name: Test helper functions
        run: Rscript tests/test_helpers.R

      - name: Update rolling GeoJSON
        env:
          VIIRS_OUTPUT_PATH: site/viirs_vegetation_24h.geojson
          ROLLING_WINDOW_HOURS: "48"
          SOURCE_OVERLAP_HOURS: "1"
          BOOTSTRAP_HOURS: "0"
          LANDCOVER_GRID_SIZE: "3"
          VEGETATION_SHARE_THRESHOLD: "0.5"
          REJECT_BUILT_CENTER: "true"
          VEGETATION_CODES: "10,20,30,40,90,95,100"
          VIIRS_CONFIDENCE: "nominal,high"
        run: Rscript R/update_viirs.R

      - name: Add status page
        run: cp web/index.html site/index.html

      - name: Check published file size
        run: |
          bytes=$(stat --format='%s' site/viirs_vegetation_24h.geojson)
          mebibytes=$((bytes / 1024 / 1024))
          echo "GeoJSON size: ${mebibytes} MiB"
          if [ "${bytes}" -gt 943718400 ]; then
            echo "GeoJSON exceeds the configured 900 MiB safety limit"
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
